<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Unofficial Professor Grant Horner Bible Reading Plan tracker with KJV text, local Bible import, and browser read-aloud." />
  <title>Professor Grant Horner Bible Reading Plan</title>

  <meta name="theme-color" content="#8d321d" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Set the theme before first paint so dark-mode users never see a light flash.
    // Same rule as applyTheme() in app.js: a saved choice wins, else the device.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("pghBiblePlan.theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- iOS still reads the apple-prefixed pair; the unprefixed one is the standard. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PGH Plan" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Professor Grant Horner Bible Reading Plan" />
  <meta property="og:description" content="Ten rotating chapter lists, local progress, KJV text, and browser read-aloud." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=esvaudio1" />
</head>
<body>
  <main id="app"></main>
  <noscript>
    <p style="max-width:60ch;margin:3rem auto;font-family:Georgia,serif">
      This reading-plan tracker needs JavaScript: it keeps your progress in the browser
      and loads chapter text on demand.
    </p>
  </noscript>
  <script src="app.js?v=esvaudio1"></script>
</body>
</html>
